name: Release

# A maintainer pushes a tag vX.Y.Z on a commit of main (never a development or agent session:
# checkout-spec's PORTING.md, "Releases"). This workflow runs the CI again, checks that the tag is
# the version of lib/sattleme/checkout/version.rb and that its commit is on main, then publishes
# the gem to RubyGems.org by trusted publishing (OIDC, no stored key) in a job bound to the
# protected environment `rubygems`, whose required reviewers approve each release. See README.md,
# "Releasing".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Before the environment's gate, so that reviewers are only asked to approve valid releases.
  tag:
    name: The tag is the gem's version, on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # RUNNER_TEMP is the job's own directory, emptied at its start and end: temporary files, and
      # the tools and caches the job installs, go there. Set here: the job's `env` cannot read the
      # runner context.
      - name: Use the runner's own temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history of main, to tell whether the tag's commit is on it.
          fetch-depth: 0
      - name: The tag is vX.Y.Z, the gem's version, on a commit of main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)"$/\1/p' lib/sattleme/checkout/version.rb)
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag $TAG is not vX.Y.Z"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not the gem's version ($version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The commit of $TAG is not on main"
            exit 1
          fi

  publish:
    name: Publish to RubyGems.org
    needs: [ci, tag]
    # A fresh machine for the one job that holds a registry's credential, as checkout-node's and
    # checkout-python's releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The protected environment (required reviewers: a maintainer approves each release). The
    # gem's trusted publisher on RubyGems.org is sattleme/checkout-ruby, release.yml, environment
    # rubygems: RubyGems.org exchanges this job's OIDC token, and no other, for a short-lived key.
    environment:
      name: rubygems
      url: https://rubygems.org/gems/sattleme-checkout
    permissions:
      contents: read
      # The OIDC token of trusted publishing.
      id-token: write
    env:
      # Gemfile.lock installed as it is, never changed; RuboCop is not needed to publish.
      BUNDLE_FROZEN: "true"
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a GitHub-hosted runner, setup-ruby's prebuilt Ruby where it was built for. The Bundler of
      # Gemfile.lock's BUNDLED WITH; no cache in a release.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: false
      - run: bundle install
      # `bundle exec rake release`: builds the gem from this very commit, leaves the tag as it is
      # (it exists), and pushes the gem with the key of trusted publishing. No wait for the release
      # to be served (it would run the newest rubygems-await, unpinned), no Sigstore attestation
      # (it would run sigstore-cli with dependencies resolved at release time, unpinned).
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          await-release: "false"
          attestations: "false"
